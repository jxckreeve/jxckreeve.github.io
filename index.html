<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="author" content="Jack Reeve">
  <meta name="description" content="Car enthusiast, engineer and dumbfuck.">
  <title>Jack Reeve - Portfolio</title>
  
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.9"></script>
</head>

<body>
  <div class="navbar">
    <a onclick="showSection('home')" class="active">Home</a>
    <a onclick="showSection('projects')">Projects</a>
    <a onclick="showSection('cv')">CV</a>
    <a onclick="showSection('contact')">Contact</a>
  </div>

  <div id="bg"></div>
  
  <header>
    <div id="title_card" class="card">
      <div><img id="photo" src="./assets/Jack.jpg"></div>
      <h1 id="name"><b>Jack Reeve</b></h1>
      <span id="description"></span>
    </div>
  </header>

  <main id="main-content"></main>
  
  <footer>
    <div id="social_card" class="card">
      <section class="tab">
        <div class="title"><i class="fas fa-users"></i>Connect</div>
        <div class="content" id="social-links"></div>
      </section>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
